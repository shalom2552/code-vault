services:
  codevault:
    build: .
    image: codevault
    container_name: codevault
    ports:
      - "5174:5174"
    volumes:
      - .:/app
    environment:
      - NODE_ENV=development
      # - TAILSCALE=0  # disable Tailscale for localhost-only use
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5174/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

services:
  cppvault:
    build: .
    container_name: myapp
    ports:
      - "5174:5174"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  test:
    build: .
    volumes:
      - .:/app           # live source — tests always reflect current files
      - /app/node_modules  # preserve Alpine-compiled node_modules from image
    command: npm test
    profiles: [test]

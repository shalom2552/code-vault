services:
  codevault:
    build: .
    image: codevault
    container_name: codevault
    ports:
      - "5174:5174"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - .:/app
    environment:
      - NODE_ENV=development
      # - TAILSCALE=0  # disable Tailscale; also comment out cap_add/devices above (required on Windows)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5174/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
